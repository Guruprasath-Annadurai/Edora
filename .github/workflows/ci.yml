name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run test

  edge-function-tests:
    name: Edge Function Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Pure-logic unit tests for edge function helpers (auth/scoring/rate-limit
      # logic extracted into testable functions, same pattern as
      # rcEntitlement.test.ts / memoryExtraction.test.ts). These existed in the
      # repo before this job did but were never actually run by CI — this job
      # closes that gap, not just adds new tests.
      # --allow-env: token-crypto.test.ts sets/restores OAUTH_TOKEN_ENCRYPTION_KEY
      #   as a test fixture (never touches real secrets).
      # --allow-net: auth-guard.test.ts imports auth-guard.ts, which imports
      #   supabase-js from esm.sh — needed for module resolution even though
      #   these tests never make a real network call.
      - run: deno test --allow-env --allow-net "supabase/functions/**/*.test.ts"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # e2e/login.spec.ts is client-side-only by design (see
      # playwright.config.ts and docs/e2e-testing.md) — no real credentials
      # are ever submitted and one test explicitly asserts no /auth/v1/
      # request fires, so this is safe to run against the real Supabase
      # project's public anon key without touching production data.
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        # Commit SHA for the diagnostics screen comes from GITHUB_SHA, which
        # Actions sets automatically on every runner — no env line needed.

  # §7 (docs/enterprise-remediation-tracker.md): this exact class of bug — a
  # stale/broken native build slipping through because nothing but a manual
  # `./gradlew assembleDebug` ever caught it — already happened once. This job
  # is the standing guardrail: builds the real Android debug APK on every
  # push/PR so a native build break is a failed CI check, not a surprise
  # during a release. Debug build only (no signing secrets needed/available
  # in CI); it exercises the same Capacitor sync + Gradle compile path a
  # release build goes through, which is what actually breaks in practice.
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: [type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, not 17: capacitor-android's Gradle module needs JDK 21 even
          # though app/build.gradle's sourceCompatibility targets 17 — see
          # the comment in android/gradle.properties. The first CI run of
          # this job failed on exactly this — a hardcoded org.gradle.java.home
          # pointing at a developer's local macOS JDK path, which doesn't
          # exist on this runner. That override is now removed; this
          # setup-java step is the actual source of JAVA_HOME for the build.
          # Kept in sync manually with the repo-root .java-version file (Phase
          # 3.2) rather than read from it: actions/setup-java has no
          # equivalent of setup-node's node-version-file input. If you bump
          # one, bump the other in the same PR.
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - run: npm run build:mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        # (The old `VITE_APP_VERSION: ${{ github.sha }}` here was dead: vite.config.ts's
        # `define` block replaces that identifier with package.json's version
        # unconditionally, so the env var was silently discarded at build time.)

  # Phase 3.3 (enterprise release-governance program): the debug build above
  # has never once verified that a *release*-configured build — R8
  # minification, resource shrinking, all active in android/app/build.gradle's
  # `release` buildType — actually compiles. That's a real, previously-
  # uncovered gap: minification is a common source of "works in debug, breaks
  # in release" bugs (reflection, missing proguard rules) that only surface
  # under this exact configuration. Verified locally before adding this job
  # (JDK 21, keystore.properties temporarily absent to replicate CI's
  # environment): `assembleRelease` succeeds cleanly, unsigned, in ~42s.
  # CI never has keystore.properties (correctly gitignored, never committed),
  # so android/app/build.gradle's own `if (keystorePropsFile.exists())` guard
  # means this job builds unsigned by construction — no signing secrets are
  # needed or exposed here. This produces an unsigned APK purely to prove the
  # release configuration compiles; it is not a distributable artifact and is
  # not uploaded anywhere.
  android-release-build:
    name: Android Release Build (unsigned)
    runs-on: ubuntu-latest
    needs: [type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - run: npm run build:mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      # Gate 1 (4.1.0 build provenance): prove Capacitor actually copied the
      # CURRENT bundle, not a stale cached one — the exact class of bug this
      # job's own header comment already names as having happened once
      # before. Verified locally before writing this step: cap sync does
      # correctly copy dist/build-info.json into the Android assets folder,
      # and its bundleHash matches dist/'s byte-for-byte.
      - name: Verify Capacitor synced the current bundle (not stale assets)
        run: |
          DIST_HASH=$(jq -r .bundleHash dist/build-info.json)
          ANDROID_HASH=$(jq -r .bundleHash android/app/src/main/assets/public/build-info.json)
          echo "dist/ bundleHash:    $DIST_HASH"
          echo "android/ bundleHash: $ANDROID_HASH"
          if [ "$DIST_HASH" != "$ANDROID_HASH" ]; then
            echo "::error::Android assets contain a different bundle than dist/ — cap sync did not run, or ran against stale output."
            exit 1
          fi
      - name: Build release APK (unsigned — verifies R8/minification, not a release artifact)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      # Gate 1: inspect the actual compiled artifact rather than trusting the
      # build succeeded means everything inside it is correct. Verified
      # locally first (this exact sequence) before writing it here.
      - name: Inspect release APK — provenance and forbidden-content checks
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          EXTRACT_DIR=$(mktemp -d)
          # -o (overwrite silently): without it, unzip prompts interactively
          # on any duplicate entry name (observed locally — Android release
          # APKs can contain colliding shortened resource filenames, a
          # benign packaging quirk unrelated to what this step actually
          # checks) and a non-interactive CI runner would hang forever
          # waiting for a keypress that never comes. Caught by actually
          # running this script locally before writing it here, not assumed.
          unzip -q -o "$APK" -d "$EXTRACT_DIR"

          # 1. APK's own binary metadata matches repo version/commit.
          BADGING=$(aapt dump badging "$APK" 2>/dev/null || $ANDROID_HOME/build-tools/*/aapt dump badging "$APK")
          echo "$BADGING" | head -1
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "$BADGING" | grep -q "versionName='$PKG_VERSION'" || { echo "::error::APK versionName does not match package.json ($PKG_VERSION)"; exit 1; }

          # 2. Embedded build-info.json inside the APK matches the commit CI is actually building.
          APK_BUILD_INFO="$EXTRACT_DIR/assets/public/build-info.json"
          if [ ! -f "$APK_BUILD_INFO" ]; then echo "::error::build-info.json missing from shipped APK assets"; exit 1; fi
          APK_SHA=$(jq -r .gitCommitSha "$APK_BUILD_INFO")
          if [ -n "$GITHUB_SHA" ] && [ "$APK_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::APK's embedded commit SHA ($APK_SHA) does not match GITHUB_SHA ($GITHUB_SHA)"; exit 1
          fi

          # 3. No .env files or source maps shipped in the client bundle.
          FOUND_ENV=$(find "$EXTRACT_DIR/assets/public" -iname ".env*" 2>/dev/null)
          FOUND_MAPS=$(find "$EXTRACT_DIR/assets/public" -iname "*.map" 2>/dev/null)
          if [ -n "$FOUND_ENV" ]; then echo "::error::.env file(s) shipped in APK: $FOUND_ENV"; exit 1; fi
          if [ -n "$FOUND_MAPS" ]; then echo "::error::source map(s) shipped in APK: $FOUND_MAPS"; exit 1; fi

          # 4. Real Supabase project URL is correctly baked in (proves prod
          #    config was injected, not silently missing/blank).
          #    NOTE: a blind grep for "localhost" was deliberately NOT used
          #    here — verified by hand that "localhost" legitimately appears
          #    in this bundle inside third-party SDK code (PostHog and
          #    Supabase-js both explicitly EXCLUDE localhost from their own
          #    cookie/persistence logic; one further occurrence is an
          #    unrelated Node URL-polyfill error-message string). A blind
          #    string match would false-positive on those every single run.
          if ! grep -rq "mlkzabspcwfockbmkmzl.supabase.co" "$EXTRACT_DIR/assets/public/assets/"*.js; then
            echo "::error::Production Supabase project URL not found in shipped bundle — VITE_SUPABASE_URL may be missing or misconfigured."; exit 1
          fi

          echo "All Gate 1 APK provenance checks passed."
          rm -rf "$EXTRACT_DIR"
      # Gate 1 exit criterion: "release artifact is retained with checksums."
      # This job's APK is unsigned and not distributable (see the job's own
      # header comment), so this retains it purely as build-provenance
      # evidence for this specific CI run, not as a release candidate to ship.
      - name: Compute checksums
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release-unsigned.apk > app-release-unsigned.apk.sha256
          cat app-release-unsigned.apk.sha256
      - name: Upload release APK + checksum + build-info (provenance evidence, not a distributable artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build-provenance
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            dist/build-info.json
          retention-days: 90

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      # Blocking gate: fails the job if a CRITICAL vulnerability exists in a
      # PRODUCTION dependency (--omit=dev). Scoped to production deps only,
      # not the full tree, because a known critical `tar` vulnerability lives
      # exclusively in dev tooling (@capacitor/assets's pinned, unpatchable
      # @capacitor/cli@5.7.8 — see docs/enterprise-remediation-tracker.md §5.1)
      # with no upstream fix available; that dev-only finding would otherwise
      # block every PR indefinitely with no way to resolve it. As of this
      # writing, production scope has 0 critical findings, so this gate is
      # active immediately, not a no-op placeholder.
      - name: Fail on critical vulnerabilities (production dependencies)
        run: npm audit --omit=dev --audit-level=critical

      # Non-blocking, staged per the remediation mandate: "start with fail on
      # critical, report high/moderate." Runs the FULL audit (prod + dev, so
      # the known dev-only critical stays visible) without failing the build,
      # and uploads a machine-readable artifact so findings can be tracked
      # over time instead of only living in scrollback.
      - name: Full audit report (non-blocking)
        if: always()
        continue-on-error: true
        run: npm audit --json > audit-report.json || true
      - name: Full audit summary (non-blocking, human-readable)
        if: always()
        continue-on-error: true
        run: npm audit || true
      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 90

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Phase 1.5 of the enterprise remediation program: the pre-mandate
      # gitleaks scan that found a real leaked secret (see
      # docs/secrets-inventory.md) was a one-off manual run, not a recurring
      # check. This makes it recurring — every push/PR is scanned for newly
      # introduced secrets. Blocking by design: a new committed secret should
      # never merge silently.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
