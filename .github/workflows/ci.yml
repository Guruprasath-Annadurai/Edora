name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run test

  edge-function-tests:
    name: Edge Function Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Pure-logic unit tests for edge function helpers (auth/scoring/rate-limit
      # logic extracted into testable functions, same pattern as
      # rcEntitlement.test.ts / memoryExtraction.test.ts). These existed in the
      # repo before this job did but were never actually run by CI — this job
      # closes that gap, not just adds new tests.
      # --allow-env: token-crypto.test.ts sets/restores OAUTH_TOKEN_ENCRYPTION_KEY
      #   as a test fixture (never touches real secrets).
      # --allow-net: auth-guard.test.ts imports auth-guard.ts, which imports
      #   supabase-js from esm.sh — needed for module resolution even though
      #   these tests never make a real network call.
      - run: deno test --allow-env --allow-net "supabase/functions/**/*.test.ts"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # e2e/login.spec.ts is client-side-only by design (see
      # playwright.config.ts and docs/e2e-testing.md) — no real credentials
      # are ever submitted and one test explicitly asserts no /auth/v1/
      # request fires, so this is safe to run against the real Supabase
      # project's public anon key without touching production data.
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        # Commit SHA for the diagnostics screen comes from GITHUB_SHA, which
        # Actions sets automatically on every runner — no env line needed.

  # §7 (docs/enterprise-remediation-tracker.md): this exact class of bug — a
  # stale/broken native build slipping through because nothing but a manual
  # `./gradlew assembleDebug` ever caught it — already happened once. This job
  # is the standing guardrail: builds the real Android debug APK on every
  # push/PR so a native build break is a failed CI check, not a surprise
  # during a release. Debug build only (no signing secrets needed/available
  # in CI); it exercises the same Capacitor sync + Gradle compile path a
  # release build goes through, which is what actually breaks in practice.
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: [type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, not 17: capacitor-android's Gradle module needs JDK 21 even
          # though app/build.gradle's sourceCompatibility targets 17 — see
          # the comment in android/gradle.properties. The first CI run of
          # this job failed on exactly this — a hardcoded org.gradle.java.home
          # pointing at a developer's local macOS JDK path, which doesn't
          # exist on this runner. That override is now removed; this
          # setup-java step is the actual source of JAVA_HOME for the build.
          # Kept in sync manually with the repo-root .java-version file (Phase
          # 3.2) rather than read from it: actions/setup-java has no
          # equivalent of setup-node's node-version-file input. If you bump
          # one, bump the other in the same PR.
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - run: npm run build:mobile
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        # (The old `VITE_APP_VERSION: ${{ github.sha }}` here was dead: vite.config.ts's
        # `define` block replaces that identifier with package.json's version
        # unconditionally, so the env var was silently discarded at build time.)

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      # Blocking gate: fails the job if a CRITICAL vulnerability exists in a
      # PRODUCTION dependency (--omit=dev). Scoped to production deps only,
      # not the full tree, because a known critical `tar` vulnerability lives
      # exclusively in dev tooling (@capacitor/assets's pinned, unpatchable
      # @capacitor/cli@5.7.8 — see docs/enterprise-remediation-tracker.md §5.1)
      # with no upstream fix available; that dev-only finding would otherwise
      # block every PR indefinitely with no way to resolve it. As of this
      # writing, production scope has 0 critical findings, so this gate is
      # active immediately, not a no-op placeholder.
      - name: Fail on critical vulnerabilities (production dependencies)
        run: npm audit --omit=dev --audit-level=critical

      # Non-blocking, staged per the remediation mandate: "start with fail on
      # critical, report high/moderate." Runs the FULL audit (prod + dev, so
      # the known dev-only critical stays visible) without failing the build,
      # and uploads a machine-readable artifact so findings can be tracked
      # over time instead of only living in scrollback.
      - name: Full audit report (non-blocking)
        if: always()
        continue-on-error: true
        run: npm audit --json > audit-report.json || true
      - name: Full audit summary (non-blocking, human-readable)
        if: always()
        continue-on-error: true
        run: npm audit || true
      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 90

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Phase 1.5 of the enterprise remediation program: the pre-mandate
      # gitleaks scan that found a real leaked secret (see
      # docs/secrets-inventory.md) was a one-off manual run, not a recurring
      # check. This makes it recurring — every push/PR is scanned for newly
      # introduced secrets. Blocking by design: a new committed secret should
      # never merge silently.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
